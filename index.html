<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus CRM — Plataforma de CRM e Automação Omnichannel</title>
<style>
:root{
  --bg:#F3F4FA; --card:#FFFFFF; --border:#E4E6F1; --border-2:#D6D9E8;
  --text:#13173A; --muted:#6B7189; --faint:#9AA0B8;
  --accent:#6D5DF6; --accent-dark:#5A48E8; --accent-soft:#EFEDFE;
  --violet:#8B5CF6; --blue:#2563EB; --cyan:#0EA5E9; --green:#16A34A;
  --wa:#25D366; --amber:#D97706; --orange:#EA580C; --red:#DC2626; --pink:#E1306C;
  --sidebar:#12152E; --sidebar-2:#1A1E3F;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(19,23,58,.06),0 10px 30px -14px rgba(19,23,58,.16);
  --shadow-lg:0 4px 12px rgba(19,23,58,.10),0 24px 60px -20px rgba(19,23,58,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9CDE0;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
svg{display:block;flex-shrink:0}

/* ============ LAYOUT ============ */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:238px;flex-shrink:0;background:linear-gradient(180deg,#151838 0%,#10122B 100%);color:#9AA0C8;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#content{flex:1;overflow-y:auto;padding:22px 26px 60px}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#8B5CF6,#6D5DF6 55%,#3B82F6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(109,93,246,.45)}
.logo-name{color:#fff;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.logo-name small{display:block;font-size:10px;font-weight:600;color:#6E75A3;letter-spacing:.14em;text-transform:uppercase}
.side-scroll{flex:1;overflow-y:auto;padding:4px 10px 12px}
.side-scroll::-webkit-scrollbar-thumb{background:#2A2F5C}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#5C6394;padding:0 10px;margin-bottom:5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7.5px 10px;border-radius:9px;color:#A6ABD1;font-weight:500;font-size:13px;cursor:pointer;position:relative;margin-bottom:1px;border:1px solid transparent;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.05);color:#E7E9FB}
.nav-item.active{background:linear-gradient(90deg,rgba(109,93,246,.28),rgba(109,93,246,.12));color:#fff;border-color:rgba(139,92,246,.35)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#8B5CF6,#6D5DF6)}
.nav-item .ico{margin-right:1px}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:rgba(109,93,246,.9);color:#fff;padding:1px 7px;border-radius:20px}
.nav-badge.gray{background:#2A2F5C;color:#A6ABD1}
.side-foot{border-top:1px solid rgba(255,255,255,.06);padding:12px}
.user-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.05);cursor:pointer}
.user-card:hover{background:rgba(255,255,255,.09)}
.user-card .uc-name{color:#fff;font-weight:600;font-size:12.5px;line-height:1.2}
.user-card .uc-role{font-size:11px;color:#7C82AE}

/* ============ TOPBAR ============ */
#topbar{height:56px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 26px}
.tb-title{font-weight:700;font-size:14.5px}
.tenant-chip{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.tenant-chip:hover{border-color:var(--border-2)}
.tb-search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6.5px 11px;color:var(--faint)}
.tb-search input{border:none;outline:none;background:transparent;flex:1;font-size:13px;color:var(--text)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;transition:.12s}
.icon-btn:hover{border-color:var(--border-2);color:var(--text);background:var(--bg)}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* ============ PAGE HEADER ============ */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.ph-title{font-size:19px;font-weight:800;letter-spacing:-.02em}
.ph-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ph-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;border:1px solid transparent;padding:7.5px 13px;font-size:12.8px;font-weight:600;transition:.12s;white-space:nowrap}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:linear-gradient(135deg,#7B6BF8,#5A48E8);color:#fff;box-shadow:0 3px 10px -2px rgba(109,93,246,.5)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-soft{background:var(--accent-soft);color:var(--accent-dark)}
.btn-soft:hover{background:#E5E2FD}
.btn-ghost{background:var(--card);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--border-2);background:var(--bg)}
.btn-danger{background:#FEEBEB;color:var(--red)}
.btn-danger:hover{background:#FBDDDD}
.btn-success{background:#E7F6EC;color:var(--green)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ============ CARDS / GRID ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:13.5px;font-weight:700}
.card-h .sub{font-size:11.5px;color:var(--muted)}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3-1{grid-template-columns:3fr 1fr}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.flex{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{display:flex;align-items:center;justify-content:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}
.bold{font-weight:700}
.right{text-align:right}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ KPI ============ */
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi-top{display:flex;align-items:center;gap:10px}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi-label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kpi-value{font-size:21px;font-weight:800;letter-spacing:-.02em}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}
.d-up{background:#E7F6EC;color:var(--green)}
.d-down{background:#FEEBEB;color:var(--red)}

/* ============ TAGS / BADGES ============ */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;white-space:nowrap}
.tag-purple{background:#EFEDFE;color:#6D28D9}
.tag-blue{background:#E8EFFE;color:#1D4ED8}
.tag-green{background:#E7F6EC;color:#15803D}
.tag-amber{background:#FEF3E2;color:#B45309}
.tag-red{background:#FEEBEB;color:#B91C1C}
.tag-gray{background:#EEF0F6;color:#4B5570}
.tag-wa{background:#E4F8EC;color:#0E8A3E}
.tag-pink{background:#FDE8F1;color:#BE185D}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.b-green{background:#E7F6EC;color:#15803D}
.b-amber{background:#FEF3E2;color:#B45309}
.b-red{background:#FEEBEB;color:#B91C1C}
.b-gray{background:#EEF0F6;color:#4B5570}
.b-blue{background:#E8EFFE;color:#1D4ED8}
.b-violet{background:#EFEDFE;color:#6D28D9}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3.5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:rgba(109,93,246,.4);color:var(--accent-dark)}

/* ============ AVATAR ============ */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex-shrink:0;letter-spacing:0}
.av-28{width:28px;height:28px;font-size:10.5px}
.av-32{width:32px;height:32px;font-size:11.5px}
.av-40{width:40px;height:40px;font-size:13.5px}
.av-48{width:48px;height:48px;font-size:15.5px}
.av-56{width:56px;height:56px;font-size:18px}
.av .st{position:relative}

/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:#FAFAFE}
.tbl td{padding:11px 12px;border-bottom:1px solid #EEF0F7;vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:#F8F8FE}
.tbl tbody tr:last-child td{border-bottom:none}
.cell-name{display:flex;align-items:center;gap:10px;min-width:0}
.cell-name .cn-t{font-weight:600;font-size:12.8px;line-height:1.25}
.cell-name .cn-s{font-size:11px;color:var(--muted)}

/* ============ SCORE RING ============ */
.score-ring{position:relative;display:inline-flex}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .sr-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800}

/* ============ PROGRESS ============ */
.prog{height:7px;border-radius:6px;background:#EDEFF7;overflow:hidden}
.prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#8B5CF6,#6D5DF6)}
.prog-fill.green{background:linear-gradient(90deg,#34D399,#16A34A)}
.prog-fill.blue{background:linear-gradient(90deg,#60A5FA,#2563EB)}
.prog-fill.amber{background:linear-gradient(90deg,#FBBF24,#D97706)}
.prog-fill.red{background:linear-gradient(90deg,#F87171,#DC2626)}

/* ============ SWITCH ============ */
.switch{position:relative;width:36px;height:20px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#D3D6E6;border-radius:20px;transition:.15s}
.switch .sl::before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl::before{transform:translateX(16px)}

/* ============ TABS ============ */
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;width:max-content}
.tab{padding:6px 14px;border-radius:8px;font-size:12.3px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(19,23,58,.12)}

/* ============ KANBAN ============ */
.kanban{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.kb-col{width:264px;min-width:264px;background:#F8F9FD;border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.kb-head{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;border-bottom:1px solid var(--border)}
.kb-dot{width:9px;height:9px;border-radius:3px}
.kb-head .kb-name{font-weight:700;font-size:12.8px}
.kb-head .kb-count{font-size:10.5px;font-weight:700;color:var(--faint);background:#ECEEF6;border-radius:20px;padding:1.5px 7px}
.kb-head .kb-sum{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
.kb-cards{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:70px}
.kb-col.drag-over{outline:2px dashed var(--accent);outline-offset:-2px;background:#F5F4FF}
.kb-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 11px;cursor:grab;box-shadow:0 1px 2px rgba(19,23,58,.05);transition:.12s;user-select:none}
.kb-card:hover{box-shadow:var(--shadow);border-color:var(--border-2);transform:translateY(-1px)}
.kb-card.dragging{opacity:.45;transform:rotate(1.5deg) scale(.98)}
.kb-card .kc-top{display:flex;align-items:center;gap:8px}
.kb-card .kc-name{font-weight:700;font-size:12.6px;line-height:1.3}
.kb-card .kc-val{margin-left:auto;font-weight:800;font-size:12.6px;white-space:nowrap}
.kb-card .kc-co{font-size:11px;color:var(--muted);margin-top:2px}
.kb-card .kc-bot{display:flex;align-items:center;gap:6px;margin-top:9px}
.kb-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;margin:0 9px 9px;border-radius:9px;border:1px dashed var(--border-2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.kb-add:hover{color:var(--accent-dark);border-color:var(--accent);background:var(--accent-soft)}

/* ============ CHAT ============ */
.chat-layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 190px);min-height:480px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cl-list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.cl-search{padding:11px;border-bottom:1px solid var(--border)}
.cl-items{flex:1;overflow-y:auto}
.cl-item{display:flex;gap:10px;padding:10.5px 12px;cursor:pointer;border-bottom:1px solid #F1F2F8;position:relative}
.cl-item:hover{background:#F8F8FE}
.cl-item.active{background:var(--accent-soft)}
.cl-item .cli-mid{flex:1;min-width:0}
.cl-item .cli-name{font-weight:700;font-size:12.8px;display:flex;align-items:center;gap:6px}
.cl-item .cli-prev{font-size:11.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cl-item .cli-time{font-size:10.5px;color:var(--faint);white-space:nowrap}
.cl-item .cli-chan{position:absolute;top:10px;right:10px}
.cl-msg{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #F1F2F8}
.cl-msg .cm-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cl-msg .cm-t{font-weight:600;font-size:12.6px}
.cl-msg .cm-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.cl-msg .cm-time{margin-left:auto;font-size:10.5px;color:var(--faint);white-space:nowrap}
.chat-main{display:flex;flex-direction:column;min-height:0;background:#FDFDFF}
.chat-head{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
.chat-head .ch-title{font-weight:700;font-size:13.5px}
.chat-head .ch-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.chat-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.date-sep{align-self:center;font-size:10.5px;font-weight:700;color:var(--faint);background:#EDEFF7;padding:2.5px 11px;border-radius:20px;margin:4px 0}
.bubble{max-width:68%;padding:8.5px 12px;border-radius:13px;font-size:12.9px;line-height:1.5;position:relative;word-wrap:break-word;box-shadow:0 1px 2px rgba(19,23,58,.06)}
.b-in{align-self:flex-start;background:#F0F1F8;border-bottom-left-radius:4px}
.b-out{align-self:flex-end;background:linear-gradient(135deg,#7B6BF8,#5A48E8);color:#fff;border-bottom-right-radius:4px}
.b-ai{align-self:flex-start;background:#F3F0FF;border:1px solid #E4DFFF;border-bottom-left-radius:4px}
.b-ai .b-ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:#6D28D9;background:#E9E3FF;border-radius:5px;padding:1px 6px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.b-meta{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10px;opacity:.65}
.b-in .b-meta{color:var(--muted)}
.b-out .b-meta{color:rgba(255,255,255,.75)}
.typing{display:inline-flex;gap:4px;padding:10px 14px;background:#F0F1F8;border-radius:13px;border-bottom-left-radius:4px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA0B8;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.quick-replies{display:flex;gap:7px;padding:8px 16px 4px;flex-wrap:wrap}
.qr{font-size:11.5px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);border:1px solid rgba(109,93,246,.3);border-radius:16px;padding:4.5px 12px;cursor:pointer}
.qr:hover{background:#E5E2FD}
.composer{display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--border);background:var(--card)}
.composer input{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:21px;padding:9px 15px;outline:none;font-size:13px}
.composer input:focus{border-color:var(--accent);background:#fff}
.ai-pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#F3F0FF,#E9E3FF);border:1px solid #DDD4FF;color:#5B21B6;font-weight:800;font-size:11px;padding:4px 11px;border-radius:20px;letter-spacing:.02em}
.human-pill{display:inline-flex;align-items:center;gap:6px;background:#E7F6EC;border:1px solid #BEE8CD;color:#15803D;font-weight:800;font-size:11px;padding:4px 11px;border-radius:20px;letter-spacing:.02em}

/* ============ DRAWER ============ */
.drawer-overlay{position:fixed;inset:0;background:rgba(16,18,43,.44);z-index:60;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer-panel{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:94vw;background:var(--card);z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .18s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.dp-head{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.dp-scroll{flex:1;overflow-y:auto;padding:16px 18px 30px}
.dp-close{position:absolute;top:14px;right:14px}
.drawer-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:14px -18px 0;padding:0 14px}
.dt{flex:1;text-align:center;padding:9px 6px;font-size:12.3px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dt.active{color:var(--accent-dark);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.f-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.f-value{font-size:12.8px;font-weight:600}

/* ============ TIMELINE ============ */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:11px;position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#EAECF6}
.tl-item:last-child::before{display:none}
.tl-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.tl-t{font-size:12.6px;font-weight:600;line-height:1.35}
.tl-s{font-size:11px;color:var(--muted);margin-top:1px}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(16,18,43,.5);z-index:70;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s;padding:20px}
.modal{background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);width:540px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;animation:popIn .16s ease-out}
@keyframes popIn{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.m-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.m-head h3{font-size:14.5px}
.m-body{padding:18px;overflow-y:auto}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:#FAFAFE;border-radius:0 0 16px 16px}

/* ============ FORMS ============ */
.f-input,.f-select,.f-textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:8.5px 11px;background:var(--card);outline:none;font-size:12.8px;transition:.12s}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,93,246,.14)}
.f-textarea{resize:vertical;min-height:90px;line-height:1.5}
.f-hint{font-size:11px;color:var(--faint)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;user-select:none}
.check-row:hover{border-color:var(--border-2)}
.check-row.on{border-color:rgba(109,93,246,.45);background:var(--accent-soft);color:var(--accent-dark)}
.check-row input{accent-color:var(--accent)}

/* ============ TOAST ============ */
.toasts{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:9px}
.toast{background:#1B1F3D;color:#E7E9FB;border-radius:12px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;min-width:260px;max-width:400px;animation:slideUp .2s ease-out;border:1px solid rgba(255,255,255,.08)}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast .t-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .t-t{font-weight:700;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase}
.toast .t-m{font-size:12px;color:#B9BEDF;line-height:1.4}
.toast code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:11px}

/* ============ WORKFLOW ============ */
.wf-layout{display:grid;grid-template-columns:218px 1fr 264px;gap:0;height:calc(100vh - 190px);min-height:520px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.wf-palette{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#FAFAFE}
.wf-pal-title{padding:13px 14px 8px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pal-group{padding:0 10px 4px}
.pal-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 6px 4px}
.pal-item{display:flex;align-items:center;gap:9px;padding:7.5px 9px;border-radius:9px;font-size:12.3px;font-weight:600;cursor:grab;border:1px solid transparent}
.pal-item:hover{background:#F0F1F8;border-color:var(--border)}
.pal-item:active{cursor:grabbing}
.pi-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wf-canvas-wrap{overflow:auto;position:relative;background:
  radial-gradient(circle,#E3E6F2 1px,transparent 1px);
  background-size:22px 22px;background-color:#FBFBFE}
.wf-canvas{position:relative;width:1020px;height:500px}
.wf-node{position:absolute;width:186px;background:var(--card);border:1.5px solid var(--border-2);border-radius:11px;padding:9px 11px;cursor:pointer;box-shadow:0 2px 6px rgba(19,23,58,.08);z-index:2;transition:.12s}
.wf-node:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.wf-node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,93,246,.18)}
.wf-node .wn-top{display:flex;align-items:center;gap:8px}
.wf-node .wn-ico{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wf-node .wn-kind{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.wf-node .wn-name{font-size:12.3px;font-weight:700;line-height:1.25}
.wf-node .wn-det{font-size:10.8px;color:var(--muted);margin-top:3px;line-height:1.35}
.wn-trigger{border-color:#A7D8BC;background:#F4FBF7}
.wn-action{border-color:#B8CDFB;background:#F5F8FF}
.wn-condition{border-color:#F5CF8F;background:#FFFAF0}
.wn-delay{border-color:#C9CDE0;background:#F8F9FC}
.wn-ai{border-color:#D2C4FD;background:#F8F6FF}
.wf-edge{position:absolute;inset:0;pointer-events:none;z-index:1}
.wf-edge path{fill:none;stroke:#A9AFCB;stroke-width:1.8}
.wf-edge .edge-on{stroke:#10B981}
.wf-edge .edge-off{stroke:#EF4444}
.edge-label{font-size:9.5px;font-weight:800;fill:#6B7189}
.wf-inspector{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:#FAFAFE}
.wf-wf-tabs{display:flex;gap:2px;padding:10px;border-bottom:1px solid var(--border);overflow-x:auto}
.wf-wf-tab{flex:1;min-width:0;padding:7px 9px;border-radius:8px;font-size:11.3px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.wf-wf-tab:hover{background:#F0F1F8}
.wf-wf-tab.active{background:var(--accent-soft);color:var(--accent-dark);border-color:rgba(109,93,246,.35)}
.wf-insp-body{flex:1;overflow-y:auto;padding:14px}
.wf-insp-empty{color:var(--faint);font-size:12px;text-align:center;padding:30px 10px;line-height:1.6}
.wf-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:center;background:var(--card)}

/* ============ AGENTS ============ */
.agent-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.agent-top{display:flex;align-items:center;gap:11px}
.agent-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.agent-name{font-weight:700;font-size:13.5px}
.agent-desc{font-size:12px;color:var(--muted);line-height:1.5}
.agent-tools{display:flex;flex-wrap:wrap;gap:5px}
.tool-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.8px;font-weight:700;background:#EEF0F6;color:#4B5570;border-radius:7px;padding:3.5px 8px}
.agent-foot{display:flex;gap:8px;margin-top:auto}
.agent-stats{display:flex;gap:0;border:1px solid var(--border);border-radius:11px;overflow:hidden;text-align:center}
.agent-stats .as{flex:1;padding:10px 6px;border-right:1px solid var(--border)}
.agent-stats .as:last-child{border-right:none}
.agent-stats .as-v{font-weight:800;font-size:15px}
.agent-stats .as-l{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}

/* ============ CALENDAR ============ */
.cal-layout{display:grid;grid-template-columns:1fr 292px;gap:14px}
.cal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cal-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);background:#FAFAFE}
.cal-grid{display:grid;grid-template-columns:58px repeat(6,1fr)}
.cal-hour-label{font-size:10px;font-weight:700;color:var(--faint);text-align:right;padding:8px 8px 0 0;height:46px}
.cal-slot{height:46px;border-right:1px solid #F0F1F7;border-bottom:1px solid #F0F1F7;position:relative;cursor:pointer}
.cal-slot:hover{background:#F6F5FF}
.cal-slot.today{background:#FAF9FF}
.cal-day-head{padding:9px 4px;text-align:center;border-right:1px solid #F0F1F7;border-bottom:1px solid var(--border);background:#FAFAFE}
.cal-day-head .cd-w{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.cal-day-head .cd-d{font-size:15px;font-weight:800;margin-top:1px}
.cal-day-head.today .cd-d{color:var(--accent-dark)}
.cal-appt{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 8px;font-size:10.8px;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(19,23,58,.2)}
.cal-appt .ca-t{opacity:.85;font-weight:600;font-size:10px}

/* ============ MISC VIEWS ============ */
.int-card{padding:15px;display:flex;flex-direction:column;gap:9px}
.int-logo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.int-name{font-weight:700;font-size:13px}
.int-desc{font-size:11.5px;color:var(--muted);line-height:1.45}
.seg-row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid #EEF0F7}
.seg-row:last-child{border-bottom:none}
.seg-row:hover{background:#FAFAFE}
.funnel-step{display:flex;align-items:center;gap:12px;padding:7px 0}
.funnel-bar{height:30px;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap}
.health-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #EEF0F7}
.health-row:last-child{border-bottom:none}
.pulse{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pulse.ok{background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.pulse.warn{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.pulse.err{background:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.18)}

/* event log */
.evlog{display:flex;flex-direction:column}
.ev-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F1F2F8;font-size:12.2px;align-items:flex-start}
.ev-item:last-child{border-bottom:none}
.ev-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ev-t{font-weight:600}
.ev-m{color:var(--muted);font-size:11.8px;margin-top:1px}
.ev-time{font-size:10.5px;color:var(--faint);white-space:nowrap}

.chart-tip{font-size:11px;color:var(--faint);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}

.empty-state{padding:44px 20px;text-align:center;color:var(--faint)}
.empty-state .es-ico{width:56px;height:56px;border-radius:16px;background:#EEF0F6;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty-state .es-t{font-weight:700;font-size:13.5px;color:var(--muted)}
.empty-state .es-s{font-size:12px;margin-top:3px}

/* ============ QR CONNECTION ============ */
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.qr-box{width:260px;height:260px;border-radius:16px;border:2px solid var(--border);background:#FAFAFE;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.qr-box img{width:100%;height:100%;object-fit:contain}
.qr-box .qr-loading{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.qr-box .qr-loading .qr-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qr-status{text-align:center;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:600;width:100%}
.qr-status.waiting{background:#FEF3C7;color:#B45309}
.qr-status.connecting{background:#E8EFFE;color:#1D4ED8}
.qr-status.success{background:#E7F6EC;color:#15803D}
.qr-status.error{background:#FEEBEB;color:#B91C1C}
.qr-status.info{background:#F4F2FF;color:#6D28D9}
.qr-timer{font-size:11px;color:var(--faint);margin-top:-6px}
.qr-actions{display:flex;gap:8px;width:100%}
.qr-actions .btn{flex:1}
.wa-instance-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#FAFAFE}
.wa-instance-card .wa-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#25D366,#128C7E);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wa-instance-card .wa-info{flex:1;min-width:0}
.wa-instance-card .wa-name{font-weight:700;font-size:13px}
.wa-instance-card .wa-detail{font-size:11px;color:var(--muted);margin-top:1px}
.wa-instance-card .wa-actions{display:flex;gap:5px;flex-shrink:0}
.modal-lg{width:520px!important}
</style>
</head>
<body>

<script>
'use strict';
/* ================= ICONS ================= */
const ICONS = {
  dashboard:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.8"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.8"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.8"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  columns:'<rect x="3" y="3" width="5.5" height="18" rx="1.6"/><rect x="9.3" y="3" width="5.5" height="13" rx="1.6"/><rect x="15.5" y="3" width="5.5" height="9" rx="1.6"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  megaphone:'<path d="M3 11l18-6v13L3 12z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  workflow:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M6 9v6"/><path d="M9 6h6a3 3 0 0 1 0 6h-3"/>',
  sparkles:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.4 2.4.9-2.4.9L19 21.6l-.9-2.4-2.4-.9 2.4-.9z"/>',

function icon(name, size, color){
  const s = size||16;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
}
/* hydrate static icon placeholders */
function hydrateIcons(root){
  (root||document).querySelectorAll('[data-ic]').forEach(el=>{ el.innerHTML = icon(el.dataset.ic, el.dataset.size||16); el.classList.remove('ico'); el.classList.add('ico-rendered'); });
}

function toast(msg, type, title){
  const t = type||'info';
  const meta = {info:{bg:'#3B82F6',ic:'info',tt:'Info'}, success:{bg:'#22C55E',ic:'check',tt:'Sucesso'}, warn:{bg:'#F59E0B',ic:'alert',tt:'Atenção'}, event:{bg:'#8B5CF6',ic:'zap',tt:'Evento'}}[t];
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="t-ico" style="background:'+meta.bg+'">'+icon(meta.ic,14,'#fff')+'</span><div><div class="t-t">'+(title||meta.tt)+'</div><div class="t-m">'+msg+'</div></div>';
  $('#toast-root').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),300); }, 4200);
}

async function evolutionRequest(path, options={}){
  const cfg=state.integration.evolution;
  if(!cfg.apiKey) throw new Error('Configure a API key do Evolution GO primeiro.');
  const response=await fetch(cfg.baseUrl.replace(/\/$/,'')+path,{...options,headers:{'Content-Type':'application/json',apikey:cfg.apiKey,...(options.headers||{})}});
  const body=await response.text();
  let data; try{data=body?JSON.parse(body):{}}catch{data={raw:body};}
  if(!response.ok) throw new Error(data.message||data.error||'Evolution GO respondeu '+response.status);
  return data;
}

/* ================= RENDER HELPERS ================= */
function scoreRing(score, size){
  const r = size/2-2.5, c = 2*Math.PI*r, pct = Math.min(100,Math.max(0,score));
  const col = pct>=75?'#16A34A':pct>=55?'#D97706':'#DC2626';
  return '<span class="score-ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#EDEFF7" stroke-width="3"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-c*pct/100)+'"/></svg><span class="sr-v">'+pct+'</span></span>';
}
function svgChart(values, w, h, color){
  const max = Math.max(...values)*1.15, min = Math.min(...values)*0.85;
  const pad=6, n=values.length;
  const pts = values.map((v,i)=>[pad+i*(w-2*pad)/(n-1), h-pad-((v-min)/(max-min||1))*(h-2*pad)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+' L'+pts[pts.length-1][0].toFixed(1)+' '+(h-pad)+' L'+pts[0][0].toFixed(1)+' '+(h-pad)+' Z';
  const g = (id)=>'<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>';
  const dots = pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="#fff" stroke="'+color+'" stroke-width="2"/>').join('');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+g('grad1')+'<path d="'+area+'" fill="url(#grad1)"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}
function weekDays(){
  const now = new Date();
  const dow = (now.getDay()+6)%7; // 0=Mon
  const mon = new Date(now); mon.setDate(now.getDate()-dow);
  const labels = ['Seg','Ter','Qua','Qui','Sex','Sáb'];
  return labels.map((l,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return {label:l, day:d.getDate(), month:d.getMonth(), isToday: i===dow}; });
}
function evIco(kind){
  const m = {stage:{bg:'#E7E5FE',c:'#6D28D9',ic:'columns'}, ai:{bg:'#F3F0FF',c:'#6D28D9',ic:'bot'}, wf:{bg:'#E8EFFE',c:'#1D4ED8',ic:'workflow'}, contact:{bg:'#E7F6EC',c:'#15803D',ic:'user'}, camp:{bg:'#FEF3E2',c:'#B45309',ic:'megaphone'}, appt:{bg:'#E0F2FE',c:'#0369A1',ic:'calendar'}, msg:{bg:'#FDE8F1',c:'#BE185D',ic:'message'}};
  const k = m[kind]||m.stage;
  return '<span class="ev-ico" style="background:'+k.bg+';color:'+k.c+'">'+icon(k.ic,13)+'</span>';
}

/* ================= PERSISTÊNCIA REAL (localStorage) ================= */
const STATE_KEY = 'nexus.state.v2';
function persistState(){
  try{
    localStorage.setItem(STATE_KEY, JSON.stringify({
      contacts: state.contacts,
      conversations: state.conversations.map(c=>({id:c.id,name:c.name,channel:c.channel,unread:0,ai:c.ai,status:c.status,time:c.time,messages:c.messages})),
      pipeline: state.pipeline,
      workflows: state.workflows,
      agents: state.agents,
      appointments: state.appointments,
      services: state.services || [],
      campaigns: state.campaigns,
      events: state.events.slice(0,40)
    }));
  }catch(e){ /* quota */ }
}
function loadPersisted(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.contacts || !d.contacts.length) return false;
    state.contacts = d.contacts;
    state.conversations = d.conversations && d.conversations.length ? d.conversations : state.conversations;
    if(d.pipeline && d.pipeline.stages) state.pipeline = d.pipeline;
    if(d.workflows) state.workflows = d.workflows;
    if(d.agents) state.agents = d.agents;
    if(d.appointments) state.appointments = d.appointments;
    if(d.services && d.services.length) state.services = d.services;
    if(d.campaigns) state.campaigns = d.campaigns;
    if(d.events) state.events = d.events;
    return true;
  }catch(e){ return false; }
}

/* ================= WHATSAPP REAL (envio/status) ================= */
async function refreshEvolutionStatus(){
  const cfg = state.integration.evolution;
  if(!cfg.apiKey || !cfg.baseUrl) return;
  try{
    const st = await evolutionRequest('/instance/status');
    const on = !!(st.data && st.data.connected && st.data.loggedIn);
    if(on !== cfg.connected){
      cfg.connected = on;
      if(on) localStorage.setItem('nexus.evolution.connected','true');
      else localStorage.removeItem('nexus.evolution.connected');
      pushEvent('integration','Status WhatsApp sincronizado: '+(on?'conectado':'desconectado'));
      render();
    }
  }catch(e){ /* silencioso */ }
}
async function sendRealWhatsApp(contactName, text){
  const contact = state.contacts.find(c=>c.name===contactName);
  if(!contact || !contact.phone) return {ok:false, reason:'sem número'};
  const number = String(contact.phone).replace(/\D/g,'');
  if(number.length < 10) return {ok:false, reason:'número inválido'};
  try{
    await evolutionRequest('/send/text', { method:'POST', body: JSON.stringify({ number: number, text: text }) });
    return { ok:true };
  }catch(err){ return { ok:false, reason: err.message }; }
}

function wfEdges(wf){
  const N = {}; wf.nodes.forEach(n=>N[n.id]=n);

    if(!a||!b) return '';

    const mid=(y1+y2)/2;
    const d='M'+x1+' '+y1+' C '+x1+' '+mid+', '+x2+' '+mid+', '+x2+' '+y2;
    return '<path d="'+d+'" class="'+(e.on===true?'edge-on':e.on===false?'edge-off':'')+'"/>'+
      (e.label?'<text x="'+(x1+x2)/2+'" y="'+(mid-5)+'" text-anchor="middle" class="edge-label">'+e.label+'</text>':'');
  });

  const hours = [];
  for(let h=8; h<=19; h++) hours.push(h);
  const inSlot = (day,start)=>{ return state.appointments.find(a=>a.day===day && a.start===start); };
  return `
  <div class="page-head">
    <div><div class="ph-title">Agenda</div><div class="ph-sub">Agendamentos com IA: o cliente marca direto no WhatsApp e aparece aqui</div></div>
    <div class="ph-actions">
      <button class="btn btn-ghost btn-sm"><span data-ic="settings" data-size="13"></span>Disponibilidade</button>
      <button class="btn btn-primary btn-sm" data-action="new-appt"><span data-ic="plus" data-size="13" style="color:#fff"></span>Novo agendamento</button>
    </div>
  </div>
  <div class="cal-layout">
    <div class="cal-card">
      <div class="cal-head">
        <span class="bold">${new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}</span>
        <div class="grow"></div>
        <button class="icon-btn"><span data-ic="chev" data-size="13" style="transform:rotate(90deg)"></span></button>
        <button class="btn btn-ghost btn-sm">Hoje</button>
        <button class="icon-btn"><span data-ic="chev" data-size="13" style="transform:rotate(-90deg)"></span></button>
      </div>
      <div class="cal-grid">
        <div></div>
        ${days.map(d=>'<div class="cal-day-head'+(d.isToday?' today':'')+'"><div class="cd-w">'+d.label+'</div><div class="cd-d">'+d.day+'</div></div>').join('')}
        ${hours.map(h=>'<div class="cal-hour-label">'+String(h).padStart(2,'0')+':00</div>'+
          days.map(d=>{
            const ap = inSlot(d.isToday?4:d.day%6, h);
            if(ap){
              const dur = (ap.end-ap.start)*46-4;
              return '<div class="cal-slot'+(d.isToday?' today':'')+'"><div class="cal-appt" style="top:2px;height:'+dur+'px;background:'+ap.color+'" data-action="open-appt" data-id="'+ap.id+'"><div class="ca-t">'+String(Math.floor(ap.start)).padStart(2,'0')+':'+(ap.start%1?'30':'00')+'</div>'+ap.client+' · '+ap.service+'</div></div>';
            }
            return '<div class="cal-slot'+(d.isToday?' today':'')+'" data-action="slot-click" data-day="'+d.day+'" data-start="'+h+'"></div>';
          }).join('')).join('')}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="card-h"><h3>Serviços</h3><div class="grow"></div><button class="icon-btn"><span data-ic="plus" data-size="13"></span></button></div>
        <div class="card-b" style="padding:8px 14px">
          ${state.services.map(s=>'<div class="seg-row" style="padding:9px 2px"><div class="grow"><div class="bold" style="font-size:12.5px">'+s.name+'</div><div class="tiny muted">'+s.dur+'</div></div><b class="small">'+s.price+'</b></div>').join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Consultores</h3></div>
        <div class="card-b" style="padding:8px 14px">
          <div class="flex" style="padding:7px 2px">'+av('Alexandre Costa',32)+'<div class="grow"><div class="bold" style="font-size:12.5px">Alexandre Costa</div><div class="tiny muted">Seg–Sex · 09:00–18:00</div></div><span class="badge b-green">Online</span></div>
          <div class="flex" style="padding:7px 2px">'+av('Ana Paula',32)+'<div class="grow"><div class="bold" style="font-size:12.5px">Ana Paula</div><div class="tiny muted">Seg–Sex · 09:00–18:00</div></div><span class="badge b-green">Online</span></div>
        </div>
      </div>
      <div class="card" style="background:#F4F2FF;border-color:#E4DFFF">
        <div class="card-b flex" style="gap:10px">
          <span style="color:#6D28D9">'+icon('bot',18)+'</span>
          <div><div class="bold small">IA agenda sozinha</div><div class="small muted" style="margin-top:2px">"Pode marcar amanhã às 15h?" → Calendar API → disponível? → agendamento criado + confirmação no WhatsApp.</div></div>
        </div>
      </div>
    </div>
  </div>`;
};

function sendChat(text){
  const conv = state.conversations.find(c=>c.id===state.selectedChat);
  if(!conv) return;
  const input = $('#chat-input');
  const msg = (text||'').trim() || (input?input.value.trim():'');
  if(!msg) return;
  if(input) input.value='';
  conv.messages.push({from:'out', name:'Você', text:msg, time:nowTime()});
  const body = $('#chat-body');
  const b = document.createElement('div');
  b.className='bubble b-out';
  b.innerHTML = esc(msg)+'<div class="b-meta">'+nowTime()+' · '+icon('check',10)+icon('check',10)+'</div>';
  body.insertBefore(b, $('#chat-typing'));
  body.scrollTop = body.scrollHeight;
  // Envio REAL via Evolution GO quando o canal é WhatsApp
  if(conv.channel==='whatsapp' && state.integration.evolution.connected){
    sendRealWhatsApp(conv.name, msg).then(r=>{
      if(!r.ok){
        b.innerHTML += '<div class="b-meta" style="color:#FCA5A5">⚠ falha no envio: '+esc(r.reason)+'</div>';
        toast('Falha ao enviar WhatsApp: '+r.reason,'warn');
      } else {
        pushEvent('wa','Mensagem enviada via WhatsApp para '+conv.name);
      }
      persistState();
    });
  }
  if(state.chatMode==='ai' && conv.ai){
    const tp = document.createElement('div');
    tp.className='typing'; tp.innerHTML='<i></i><i></i><i></i>';
    $('#chat-typing').appendChild(tp);
    body.scrollTop=body.scrollHeight;
    setTimeout(()=>{
      if(!document.body.contains(tp)) return;
      tp.remove();
      const reply = AI_POOL[conv.messages.length % AI_POOL.length];
      conv.messages.push({from:'ai', name:'IA', text:reply, time:nowTime()});
      const rb = document.createElement('div');
      rb.className='bubble b-ai';
      rb.innerHTML='<span class="b-ai-tag">'+icon('bot',9)+' IA</span><div>'+esc(reply)+'</div><div class="b-meta">'+nowTime()+' · 0,8s</div>';
      body.insertBefore(rb, $('#chat-typing'));
      body.scrollTop=body.scrollHeight;
      const prev = document.querySelector('.cl-item.active .cli-prev');
      if(prev) prev.textContent = reply;
    }, 1200);
  }
}
function bindKanban(){
  window._dragUntil = 0;
  document.querySelectorAll('.kb-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain', card.dataset.opp);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); window._dragUntil = Date.now()+300; });
  });
  document.querySelectorAll('.kb-col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const target = col.dataset.stage;
      let item=null, from=null;
      state.pipeline.stages.forEach(s=>{ const i=s.items.find(x=>x.id===id); if(i){item=i; from=s.id;} });
      if(!item || from===target) return;
      const fromStage = state.pipeline.stages.find(s=>s.id===from);
      const toStage = state.pipeline.stages.find(s=>s.id===target);
      fromStage.items = fromStage.items.filter(x=>x.id!==id);
      toStage.items.push(item); item.stage=target;
      recomputeSums();
      pushEvent('stage','Oportunidade "'+item.name+'" movida: '+fromStage.name+' → '+toStage.name);
      toast('<code>opportunity.stage_changed</code><br>'+item.name+' · '+fromStage.name+' → '+toStage.name,'event');
      render();
    });
  });
}

async function startQRFlow(instanceName) {
  const statusEl = document.getElementById('qr-status');
  const boxEl = document.getElementById('qr-box');
  const timerEl = document.getElementById('qr-timer');
  if (!statusEl || !boxEl) return;
  try {
    statusEl.className = 'qr-status connecting';
    statusEl.textContent = 'Iniciando instancia...';
    try { await evolutionRequest('/instance/create', { method: 'POST', body: JSON.stringify({ name: instanceName, token: instanceName }) }); } catch(e){}
    statusEl.textContent = 'Conectando...';
    await evolutionRequest('/instance/connect', { method: 'POST', body: JSON.stringify({}) });
    statusEl.className = 'qr-status waiting';
    statusEl.textContent = 'Escaneie o QR Code com seu WhatsApp';
    let connected = false;
    const poll = async () => {
      if (!document.getElementById('qr-box') || connected) return;
      try {
        const res = await evolutionRequest('/instance/qr');
        if (res.data && res.data.code) {
          const qrData = res.data.code;
          boxEl.innerHTML = '<img src="' + (qrData.startsWith('data:') ? qrData : 'data:image/png;base64,' + qrData) + '" alt="QR Code WhatsApp">';
          startQRTimer(timerEl);
        }
        const st = await evolutionRequest('/instance/status');
        if (st.data && st.data.connected && st.data.loggedIn) {
          connected = true; if (waQRTimer) clearTimeout(waQRTimer);
          showQRSuccess(statusEl, st.data); return;
        }
      } catch(e){}
      if (!connected && document.getElementById('qr-box')) waQRTimer = setTimeout(poll, 3000);
    };
    setTimeout(poll, 2000);
  } catch (err) {
    statusEl.className = 'qr-status error';
    statusEl.textContent = 'Erro: ' + (err.message || 'Falha ao conectar');
    boxEl.innerHTML = '<div class="qr-loading"><span style="color:var(--red)">' + esc(err.message) + '</span></div>';
  }
}

function startQRTimer(timerEl) {
  if (waQRCountdown) clearInterval(waQRCountdown);
  let remaining = 40;
  if (timerEl) timerEl.textContent = 'QR Code expira em ' + remaining + 's';
  waQRCountdown = setInterval(() => {
    remaining--;
    if (timerEl) { timerEl.textContent = 'QR Code expira em ' + remaining + 's'; if (remaining <= 10) timerEl.style.color = 'var(--red)'; }
    if (remaining <= 0) { clearInterval(waQRCountdown); if (timerEl) timerEl.textContent = 'QR Code expirado - gerando novo...'; }
  }, 1000);
}

function showQRSuccess(statusEl, data) {
  if (waQRCountdown) clearInterval(waQRCountdown);
  statusEl.className = 'qr-status success';
  statusEl.textContent = 'WhatsApp conectado com sucesso!';
  const boxEl = document.getElementById('qr-box');
  if (boxEl) boxEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#15803D"><span style="font-size:40px">&#10003;</span><span style="font-weight:700;font-size:13px">Conectado</span>' + (data.name ? '<span class="small muted">' + esc(data.name) + '</span>' : '') + (data.jid ? '<span class="tiny muted" style="word-break:break-all">' + esc(data.jid) + '</span>' : '') + '</div>';
  const timerEl2 = document.getElementById('qr-timer');
  if (timerEl2) timerEl2.textContent = '';
  state.integration.evolution.connected = true;
  localStorage.setItem('nexus.evolution.connected', 'true');
  const foot = document.querySelector('.m-foot');
  if (foot) { foot.innerHTML = '<div></div><div class="flex" style="gap:6px"><button class="btn btn-danger btn-sm" data-action="wa-disconnect" data-instance="' + esc(state.integration.evolution.instance) + '"><span data-ic="power" data-size="12"></span>Desconectar</button><button class="btn btn-primary btn-sm" data-action="close-qr-modal">Fechar</button></div>'; hydrateIcons(foot); }
  pushEvent('integration', 'WhatsApp conectado via Evolution GO');
  toast('WhatsApp conectado com sucesso!', 'success');
}

/* ================= GLOBAL DELEGATION ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  // Painéis [data-stop] (modais): executa ações internas, mas cliques no
  // corpo do painel não devem "vazar" para a ação de um ancestral (ex.: fechar).
  const stopper = e.target.closest('[data-stop]');
  if(stopper && !stopper.contains(el)) return;
  const fn = ACTIONS[el.dataset.action];
  if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); closeDrawer(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const i=document.querySelector('#content input'); if(i) i.focus(); }
});
/* sidebar nav */
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click', ()=>go(n.dataset.nav));
});

/* ================= INIT ================= */
function init(){
  let restored = false;
  try { restored = loadPersisted(); }
  catch(e){ try{ localStorage.removeItem(STATE_KEY); }catch(_){} restored = false; }
  if(!restored){
    state.contacts = makeContacts();
    state.conversations = makeConversations();
    makePipeline();
    state.workflows = makeWorkflows();
    state.agents = makeAgents();
    state.appointments = makeAppointments();
    state.services = [
      {name:'Consultoria', dur:'30 min', price:'R$ 290'},
      {name:'Sessão comercial', dur:'60 min', price:'R$ 490'},
      {name:'Diagnóstico gratuito', dur:'15 min', price:'Grátis'}
    ];
    state.campaigns = makeCampaigns();
    state.events = makeEvents();
    persistState();
  }
  state.analytics = makeAnalytics();
  state.admin = makeAdmin();
  if(!state.selectedChat || !state.conversations.find(c=>c.id===state.selectedChat)) state.selectedChat = state.conversations[0].id;
  hydrateIcons(document);
  try{
    render();
  }catch(err){
    console.error('Falha ao renderizar com dados salvos — restaurando padrão.', err);
    try{ localStorage.removeItem(STATE_KEY); }catch(_){}
    state.contacts = makeContacts();
